name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pystray pillow
      - run: pyinstaller --onefile --noconsole --uac-admin zapret_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: zapret_gui_exe
          path: dist/zapret_gui.exe
